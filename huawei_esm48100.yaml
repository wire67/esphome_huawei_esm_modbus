    modbus_controller_id: esm_bms
    name: "Status Register 14"
    id: status_14
    register_type: holding
    address: 14
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: esm_bms
    name: "Status Register 74"
    id: status_74
    register_type: holding
    address: 74
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: esm_bms
    name: "Status Register 1329"
    id: status_1329
    register_type: holding
    address: 1329
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: esm_bms
    name: "Capacity"
    id: nominal_capacity
    unit_of_measurement: "Wh"
    register_type: holding
    address: 32152 ## or 32153 or 32155
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  # --- Calculated Power ---
  - platform: template
    name: "Battery Power"
    id: battery_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(battery_voltage).has_state() && id(battery_current).has_state()) {
        return id(battery_voltage).state * id(battery_current).state;
      }
      return NAN;
    update_interval: 10s
  # --- Cell Voltage Delta (max - min) ---
  - platform: template
    name: "Cell Voltage Delta"
    id: cell_voltage_delta
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      float min_v = NAN;
      float max_v = NAN;
      auto cells = std::array<esphome::modbus_controller::ModbusSensor*, 15>{
        id(cell_01_voltage), id(cell_02_voltage), id(cell_03_voltage),
        id(cell_04_voltage), id(cell_05_voltage), id(cell_06_voltage),
        id(cell_07_voltage), id(cell_08_voltage), id(cell_09_voltage),
        id(cell_10_voltage), id(cell_11_voltage), id(cell_12_voltage),
        id(cell_13_voltage), id(cell_14_voltage), id(cell_15_voltage)
      };
      for (auto *cell : cells) {
        if (cell->has_state()) {
          float v = cell->state;
          if (isnan(min_v) || v < min_v) min_v = v;
          if (isnan(max_v) || v > max_v) max_v = v;
        }
      }
      if (!isnan(min_v) && !isnan(max_v)) {
        return max_v - min_v;
      }
      return NAN;
    update_interval: 10s
    entity_category: diagnostic


  # --- Remaining Capacity in Wh ---
  - platform: template
    name: "Remaining Capacity"
    id: remaining_capacity
    unit_of_measurement: "Wh"
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(nominal_capacity).has_state() && id(battery_soc).has_state()) {
        // nominal_capacity is in Wh, battery_soc is in %
        float cap = id(nominal_capacity).state;
        float soc = id(battery_soc).state;
        float soh = id(battery_soh).state;
        return cap * (soc / 100.0f) * (soh / 100.0f);
      }
      return NAN;
    update_interval: 10s
    entity_category: diagnostic

# ─── Binary Sensors (status decoding) ──────────────────────
binary_sensor:

  # Status 10: 1=not charging, 0=charging, 3=fault
  - platform: template
    name: "BMS Charging"
    id: bms_charging
    device_class: battery_charging
    lambda: |-
      if (id(status_10).has_state()) {
        int s = int(id(status_10).state);
        return s == 0;  // 0 = charging
      }
      return false;

  # Status 14: 3=not charging, 2=charging, 1=fault
  - platform: template
    name: "BMS Discharging"
    id: bms_discharging
    lambda: |-
      if (id(status_14).has_state()) {
        int s = int(id(status_14).state);
        return s == 2;  // 2 = discharging
      }
      return false;

  # Fault detection from status registers
  - platform: template
    name: "BMS Fault"
    id: bms_fault
    device_class: problem
    lambda: |-
      if (id(status_14).has_state()) {
        int s14 = int(id(status_14).state);
        return (s14 == 1);
      }
      return false;

# ─── Text Sensors ──────────────────────────────────────────
text_sensor:

  # Human-readable charge state
  - platform: template
    name: "Battery State"
    id: battery_state
    lambda: |-
      if (!id(status_14).has_state()) {
        return std::string("Unknown");
      }
      int s14 = int(id(status_14).state);
      if (s14 == 1) return std::string("Fault");
      if (s14 == 2) return std::string("Charging");
      if (s14 == 3) return std::string("Discharging");
      if (s14 == 4) return std::string("Idle");
      return std::string("Other");
    update_interval: 10s

  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      entity_category: diagnostic