# ============================================================
# ESPHome - Huawei ESM-48100 BMS via RS485 Modbus RTU
# ============================================================
#
# HARDWARE REQUIRED:
#   - ESP32 dev board (ESP32-WROOM or similar)
#   - MAX485 / SP3485 RS485 transceiver module
#
# WIRING (ESP32 <-> MAX485 module):
#   ESP32 GPIO16 (TX2)  --> DI  (Data In)
#   ESP32 GPIO17 (RX2)  --> RO  (Receiver Output)
#   ESP32 GPIO4         --> DE + RE (tied together, flow control)
#   3.3V                --> VCC
#   GND                 --> GND
#
# WIRING (MAX485 <-> ESM-48100 RJ45 COM port):
#   A+ (MAX485)  --> Pin 1: RS485 T+  (or Pin 4: RS485 R+)
#   B- (MAX485)  --> Pin 2: RS485 T-  (or Pin 5: RS485 R-)
#   Use a 120Ω termination resistor at the far end of the bus.
#
# RJ45 PIN REFERENCE (ESM-48100 COM port):
#   Pin 1 - RS485 T+
#   Pin 2 - RS485 T-
#   Pin 3 - NC (reserved)
#   Pin 4 - RS485 R+
#   Pin 5 - RS485 R-
#   Pin 6 - NC (reserved)
#   Pin 7 - CANH (CAN - not used here)
#   Pin 8 - CANL (CAN - not used here)
#
# MODBUS SETTINGS:
#   Protocol : Modbus RTU
#   Baud rate: 9600 bps
#   Data bits: 8
#   Parity   : None
#   Stop bits: 1
#   Default slave address: 214
#
# VERIFIED REGISTER MAP (ESM-48100U2/U5)
# ============================================================

esphome:
  name: huawei-esm48100
  friendly_name: Huawei ESM-48100 Battery

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging (disable serial logging to free UART0 if needed)
logger:
  baud_rate: 0    # disables serial logging so UART0 is free
  level: VERBOSE

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESM48100 Fallback"
    password: !secret ap_password

captive_portal:

# ─── UART for RS485 ────────────────────────────────────────
uart:
  id: uart_modbus
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE

# ─── Modbus ────────────────────────────────────────────────
modbus:
  id: modbus_esm
  uart_id: uart_modbus
  send_wait_time: 250ms

# ─── Modbus Controller ─────────────────────────────────────
modbus_controller:
  - id: esm_bms
    address: 214
    modbus_id: modbus_esm
    setup_priority: -10
    update_interval: 5s

# ─── Sensors ───────────────────────────────────────────────
sensor:

  # --- Battery Voltage (Register 0) ---
  - platform: modbus_controller
    modbus_controller_id: esm_bms
    name: "Battery Voltage"
    id: battery_voltage
    register_type: holding
    address: 0
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - clamp:
          min_value: 0.0
          max_value: 100.0
          ignore_out_of_range: true


  # --- Pack Voltage (Register 1) ---
